<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Memorilo - Folded M</title>
  <desc>An emerald folded book forming an M on a warm ivory application tile.</desc>
  <defs>
    <linearGradient id="tile" x1="200" y1="80" x2="800" y2="950" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#E8E1D3"/>
    </linearGradient>
    <linearGradient id="left" x1="283" y1="320" x2="512" y2="750" gradientUnits="userSpaceOnUse">
