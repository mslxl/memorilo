<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Memorilo - Memory Loop</title>
  <desc>A continuous copper ribbon forming a memory loop on an opaque graphite application tile.</desc>
  <defs>
    <linearGradient id="tile" x1="180" y1="80" x2="850" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#373A36"/>
      <stop offset="1" stop-color="#1C211F"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="270" y1="385" x2="762" y2="665" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5C99A"/>
      <stop offset=".48" stop-color="#E6A474"/>
      <stop offset="1" stop-color="#B66A46"/>
    </linearGradient>
    <linearGradient id="crossing" x1="432" y1="413" x2="602" y2="595" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3BD89"/>
      <stop offset="1" stop-color="#D99161"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#000000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="198" fill="url(#tile)"/>
  <rect x="66" y="66" width="892" height="892" rx="196" fill="none" stroke="#74766A" stroke-opacity=".28" stroke-width="4"/>
  <g filter="url(#shadow)">
    <path d="M512 512C440 404 405 360 344 360C172 360 172 664 344 664C405 664 440 620 512 512C584 404 619 360 680 360C852 360 852 664 680 664C619 664 584 620 512 512Z"
      fill="none" stroke="url(#ribbon)" stroke-width="90" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M448 420C469 449 490 480 512 512C534 544 555 575 576 604"
      fill="none" stroke="#2B2E29" stroke-width="113" stroke-linecap="butt"/>
    <path d="M438 406C463 442 488 477 512 512C536 547 561 582 586 618"
      fill="none" stroke="url(#crossing)" stroke-width="90" stroke-linecap="butt"/>
  </g>
</svg>
