<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Memorilo - Recall Cards</title>
  <desc>A stack of ivory study cards with a return symbol on a terracotta application tile.</desc>
  <defs>
    <linearGradient id="tile" x1="160" y1="64" x2="820" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DA855E"/>
      <stop offset="1" stop-color="#B84B36"/>
    </linearGradient>
    <linearGradient id="paper" x1="340" y1="260" x2="690" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFAE9"/>
      <stop offset="1" stop-color="#F3E4C5"/>
    </linearGradient>
    <filter id="shadow" x="-45%" y="-35%" width="190%" height="185%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#71301E" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="198" fill="url(#tile)"/>
  <rect x="66" y="66" width="892" height="892" rx="196" fill="none" stroke="#F1AF85" stroke-opacity=".6" stroke-width="4"/>
  <g filter="url(#shadow)">
    <rect x="312" y="268" width="422" height="486" rx="54" fill="#E1B187" transform="rotate(13 523 511)"/>
    <rect x="262" y="256" width="422" height="486" rx="54" fill="#F1D5AE" transform="rotate(-10 473 499)"/>
    <rect x="292" y="277" width="440" height="500" rx="54" fill="url(#paper)"/>
    <path d="M348 280H676Q729 280 729 333" fill="none" stroke="#FFFFFF" stroke-opacity=".65" stroke-width="5"/>
  </g>
  <path d="M420 459A112 112 0 1 1 434 635" fill="none" stroke="#A74732" stroke-width="46" stroke-linecap="round"/>
  <path d="M400 387L400 476L489 476" fill="none" stroke="#A74732" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
