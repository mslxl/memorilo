[package]
name = "memorilo-device-firmware"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["fake-display"]
fake-display = []
hardware-display = []
color-test = []
coordinator-test = []

[dependencies]
anyhow = "1.0.104"
embedded-graphics-core = "0.4.0"
log = "0.4.34"
postcard = { version = "1.1.3", features = ["use-std"] }
prost = "0.13"
prost-types = "0.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
u8g2-fonts = "0.8.0"

[target.'cfg(target_os = "espidf")'.dependencies]
esp32-nimble = "0.12.0"
esp-idf-svc = "0.52.1"
esp-idf-sys = "0.37.2"

[build-dependencies]
embuild = { version = "0.33.4", features = ["espidf"] }
prost-build = "0.13"
protoc-bin-vendored = "3"

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.5.2"
esp_idf_tools_install_dir = "global"

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
