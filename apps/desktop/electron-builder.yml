appId: dev.memorilo.desktop
productName: Memorilo
executableName: memorilo

directories:
  buildResources: resources
  output: dist

artifactName: Memorilo-${version}-${os}-${arch}.${ext}

files:
  - out/**/*
  - package.json

extraResources:
  - from: ../../.cache/embedding-models
    to: embedding-models
  - from: ../../packages/editor-storage/drizzle
    to: editor-storage-migrations
  - from: ../../packages/excalidraw/excalidraw/fonts/Xiaolai
    to: typst-fonts/Xiaolai

asar: true
asarUnpack:
  - node_modules/@huggingface/transformers/**
  - node_modules/@img/**
  - node_modules/@open-spaced-repetition/**
  - node_modules/better-sqlite3/**
  - node_modules/loro-crdt/**
  - node_modules/onnxruntime-node/**
  - node_modules/sharp/**
  - node_modules/sqlite-vec*/**
  - node_modules/@myriaddreamin/typst-ts-node-compiler/**
  - node_modules/@myriaddreamin/typst-ts-node-compiler-*/**

npmRebuild: false
nativeRebuilder: sequential

mac:
  icon: resources/icon.icns
  extendInfo:
    NSLocalNetworkUsageDescription: Memorilo uses your local network to discover and sync with paired devices.
    NSBonjourServices:
      - _p2p._udp
      - _memorilo._tcp
  target:
    - dmg
    - zip

linux:
  category: Utility
  icon: resources/icons
  target:
    - AppImage
    - deb
    - rpm

win:
  icon: resources/icon.ico
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
